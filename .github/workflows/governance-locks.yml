name: Governance lock validation

on:
  pull_request:
    paths:
      - ".github/workflows/governance-locks.yml"
      - "utils/risk_control.py"
      - "tests/test_cross_platform_locking.py"
      - "tests/test_governance_ci_config.py"
  push:
    paths:
      - ".github/workflows/governance-locks.yml"
      - "utils/risk_control.py"
      - "tests/test_cross_platform_locking.py"
      - "tests/test_governance_ci_config.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-platform-locks:
    name: Lock validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run cross-platform governance lock tests
        run: >-
          python -m unittest
          tests.test_cross_platform_locking
          tests.test_governance_ci_config
          -v
