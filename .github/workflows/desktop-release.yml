  windows-x86_64:
    needs: frontend
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Cache locked Python downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~\AppData\Local\uv\cache
          key: windows-x86_64-uv-${{ hashFiles('uv.lock') }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sau_frontend/package-lock.json
      - name: Install locked Python and frontend dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==$env:UV_VERSION"
          uv sync --frozen --extra desktop --extra build
          Push-Location sau_frontend
          try { npm ci } finally { Pop-Location }
      - name: Download clean matching Chromium and build installer
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}\patchright-browsers
        run: |
          $Python = "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe"
          & $Python -m patchright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Patchright Chromium download failed.' }
          $BrowserSource = Join-Path $env:PLAYWRIGHT_BROWSERS_PATH "chromium-$env:BROWSER_REVISION"
          if (-not (Test-Path -LiteralPath $BrowserSource -PathType Container)) { throw 'Matching Chromium directory is missing.' }
          # release_tools.stage_browser is invoked fail-closed by build_installer.ps1.
          .\packaging\windows\build_installer.ps1 -BrowserSource $BrowserSource -BrowserRevision $env:BROWSER_REVISION -PythonExecutable $Python
          & $Python -m release_tools.verify_release --root dist\SocialAutoUpload --platform windows --arch x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Windows release verification failed.' }
      - name: Run frozen CLI smoke
        run: |
          $env:SOCIAL_AUTO_UPLOAD_HOME = Join-Path $env:RUNNER_TEMP 'sau-cli-home'
          & .\dist\SocialAutoUpload\sau.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Frozen CLI smoke failed.' }
      - name: Run bundled browser smoke
        run: |
          @'
          import json
          from pathlib import Path
          from patchright.sync_api import sync_playwright
          root = Path("dist/SocialAutoUpload/_internal")
          manifest = json.loads((root / "browser-manifest.json").read_text())
          executable = root / manifest["payloads"]["windows-x86_64"]["executable"]
          with sync_playwright() as api:
              browser = api.chromium.launch(executable_path=str(executable), headless=True)
              page = browser.new_page()
              page.goto("data:text/html,<title>SAU Offline</title><p>browser-ok</p>")
              assert page.title() == "SAU Offline"
              assert page.locator("p").inner_text() == "browser-ok"
              browser.close()
          '@ | & .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'Bundled browser smoke failed.' }
      - name: Run frozen GUI smoke
        run: |
          $env:SOCIAL_AUTO_UPLOAD_HOME = Join-Path $env:RUNNER_TEMP 'sau-gui-home'
          $StatusFile = Join-Path $env:RUNNER_TEMP 'sau-frozen-gui.status'
          Remove-Item -LiteralPath $StatusFile -Force -ErrorAction SilentlyContinue
          $env:SAU_DESKTOP_STATUS_FILE = $StatusFile
          $Process = Start-Process .\dist\SocialAutoUpload\SocialAutoUpload.exe -PassThru
          try {
            $Base = $null
            for ($Attempt = 0; $Attempt -lt 200; $Attempt++) {
              if ($Process.HasExited) { throw 'Frozen GUI exited before health readiness.' }
              $ReadyLine = @(
                Get-Content -LiteralPath $StatusFile -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '^server-ready http://127\.0\.0\.1:[1-9][0-9]{0,4}/$' }
              ) | Select-Object -Last 1
              if ($null -ne $ReadyLine) {
                $CandidateBase = $ReadyLine.Substring('server-ready '.Length).TrimEnd('/')
                try {
                  $ReadyUri = [Uri]$CandidateBase
                  if ($ReadyUri.Scheme -ne 'http' -or $ReadyUri.Host -ne '127.0.0.1' -or $ReadyUri.Port -lt 1) {
                    throw 'Desktop status reported a non-loopback endpoint.'
                  }
                  $Health = Invoke-RestMethod -Uri "$CandidateBase/api/v1/health" -TimeoutSec 1
                  if ($Health.ok -eq $true -and $Health.data.status -eq 'ok') {
                    $Base = $CandidateBase
                  }
                } catch {}
              }
              if ($null -ne $Base) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($null -eq $Base) {
              $Status = if (Test-Path -LiteralPath $StatusFile -PathType Leaf) { Get-Content -LiteralPath $StatusFile -Raw } else { 'status-file-missing' }
              throw "Frozen GUI did not report a healthy endpoint. Status: $Status"
            }
            $Session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-RestMethod -Uri "$Base/" -WebSession $Session | Out-Null
            Invoke-RestMethod -Method Post -Uri "$Base/api/v1/app/quit" -WebSession $Session -Headers @{ Origin = $Base } | Out-Null
            if (-not $Process.WaitForExit(15000)) {
              $Status = Get-Content -LiteralPath $StatusFile -Raw -ErrorAction SilentlyContinue
              throw "Frozen GUI did not exit after protected quit. Status: $Status"
            }
            if ($Process.ExitCode -ne 0) { throw "Frozen GUI exited $($Process.ExitCode)." }
          } finally {
            $env:SAU_DESKTOP_STATUS_FILE = $null
            if (-not $Process.HasExited) { Stop-Process -Id $Process.Id -Force }
          }
      - name: Run silent install smoke
        run: |
          $Installer = Resolve-Path .\release\SocialAutoUpload-Windows-x64-Setup.exe
          $InstallDir = Join-Path $env:RUNNER_TEMP 'SocialAutoUpload-installed'
          $Result = Start-Process $Installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$InstallDir") -Wait -PassThru
          if ($Result.ExitCode -ne 0) { throw "Silent installer exited $($Result.ExitCode)." }
          if (-not (Test-Path "$InstallDir\sau.exe" -PathType Leaf)) { throw 'Installed CLI is missing.' }
      - name: Run installed CLI GUI browser and uninstall and data preservation smoke
        run: |
          $InstallDir = Join-Path $env:RUNNER_TEMP 'SocialAutoUpload-installed'
          $DataRoot = Join-Path $env:LOCALAPPDATA 'SocialAutoUpload'
          New-Item -ItemType Directory -Force -Path $DataRoot | Out-Null
          $Sentinel = Join-Path $DataRoot 'ci-preserve.txt'
          Set-Content -LiteralPath $Sentinel -Value 'preserve' -NoNewline
          & "$InstallDir\sau.exe" --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed.' }
          $env:SAU_INSTALL_DIR = $InstallDir
          @'
          import json
          import os
          from pathlib import Path
          from patchright.sync_api import sync_playwright
          root = Path(os.environ["SAU_INSTALL_DIR"]) / "_internal"
          manifest = json.loads((root / "browser-manifest.json").read_text())
          executable = root / manifest["payloads"]["windows-x86_64"]["executable"]
          with sync_playwright() as api:
              browser = api.chromium.launch(executable_path=str(executable), headless=True)
              page = browser.new_page()
              page.goto("data:text/html,<title>Installed SAU</title><p>installed-browser-ok</p>")
              assert page.title() == "Installed SAU"
              assert page.locator("p").inner_text() == "installed-browser-ok"
              browser.close()
          '@ | & .\.venv\Scripts\python.exe -
          if ($LASTEXITCODE -ne 0) { throw 'Installed bundled browser failed.' }
          $StatusFile = Join-Path $env:RUNNER_TEMP 'sau-installed-gui.status'
          Remove-Item -LiteralPath $StatusFile -Force -ErrorAction SilentlyContinue
          $env:SAU_DESKTOP_STATUS_FILE = $StatusFile
          $Process = Start-Process "$InstallDir\SocialAutoUpload.exe" -PassThru
          try {
            $Base = $null
            for ($Attempt = 0; $Attempt -lt 200; $Attempt++) {
              if ($Process.HasExited) { throw 'Installed GUI exited before health readiness.' }
              $ReadyLine = @(
                Get-Content -LiteralPath $StatusFile -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '^server-ready http://127\.0\.0\.1:[1-9][0-9]{0,4}/$' }
              ) | Select-Object -Last 1
              if ($null -ne $ReadyLine) {
                $CandidateBase = $ReadyLine.Substring('server-ready '.Length).TrimEnd('/')
                try {
                  $ReadyUri = [Uri]$CandidateBase
                  if ($ReadyUri.Scheme -ne 'http' -or $ReadyUri.Host -ne '127.0.0.1' -or $ReadyUri.Port -lt 1) {
                    throw 'Desktop status reported a non-loopback endpoint.'
                  }
                  $Health = Invoke-RestMethod -Uri "$CandidateBase/api/v1/health" -TimeoutSec 1
                  if ($Health.ok -eq $true -and $Health.data.status -eq 'ok') {
                    $Base = $CandidateBase
                  }
                } catch {}
              }
              if ($null -ne $Base) { break }
              Start-Sleep -Milliseconds 100
            }
            if ($null -eq $Base) {
              $Status = if (Test-Path -LiteralPath $StatusFile -PathType Leaf) { Get-Content -LiteralPath $StatusFile -Raw } else { 'status-file-missing' }
              throw "Installed GUI did not report a healthy endpoint. Status: $Status"
            }
            $Session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            Invoke-RestMethod -Uri "$Base/" -WebSession $Session | Out-Null
            Invoke-RestMethod -Method Post -Uri "$Base/api/v1/app/quit" -WebSession $Session -Headers @{ Origin = $Base } | Out-Null
            if (-not $Process.WaitForExit(15000)) {
              $Status = Get-Content -LiteralPath $StatusFile -Raw -ErrorAction SilentlyContinue
              throw "Installed GUI did not exit after protected quit. Status: $Status"
            }
            if ($Process.ExitCode -ne 0) { throw "Installed GUI exited $($Process.ExitCode)." }
          } finally {
            $env:SAU_DESKTOP_STATUS_FILE = $null
            if (-not $Process.HasExited) { Stop-Process -Id $Process.Id -Force }
          }
          $Python = "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe"
          & $Python -m release_tools.verify_release --root $InstallDir --platform windows --arch x86_64
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows payload verification failed.' }
          Copy-Item "$InstallDir\release-manifest.json" .\release\windows-x86_64-release-manifest.json
          Copy-Item "$InstallDir\SHA256SUMS" .\release\windows-x86_64-SHA256SUMS
          $ArtifactDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          New-Item -ItemType Directory -Force -Path $ArtifactDirectory | Out-Null
          $ArchiveName = 'windows-installed-payload.tar'
          $Archive = Join-Path $ArtifactDirectory $ArchiveName
          $ArchiveChecksum = "$Archive.sha256"
          $InstallParent = [IO.Path]::GetDirectoryName($InstallDir)
          $InstallLeaf = [IO.Path]::GetFileName($InstallDir)
          & tar.exe -cf $Archive -C $InstallParent $InstallLeaf
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows payload archive failed.' }
          $ArchiveHash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($ArchiveChecksum, "$ArchiveHash  $ArchiveName`n", [Text.Encoding]::ASCII)
          $Uninstaller = Get-ChildItem -LiteralPath $InstallDir -Filter 'unins*.exe' | Select-Object -First 1
          if ($null -eq $Uninstaller) { throw 'Uninstaller is missing.' }
          $Result = Start-Process $Uninstaller.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($Result.ExitCode -ne 0) { throw "Uninstaller exited $($Result.ExitCode)." }
          if (Test-Path -LiteralPath "$InstallDir\sau.exe") { throw 'Uninstall left the installed CLI behind.' }
          if (-not (Test-Path -LiteralPath $Sentinel -PathType Leaf)) { throw 'Uninstall removed user data.' }
          Remove-Item -LiteralPath $Sentinel -Force
      - name: Upload verified Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sau-windows-x86_64-installer
          path: |
            release/SocialAutoUpload-Windows-x64-Setup.exe
            release/SocialAutoUpload-Windows-x64-Setup.exe.sha256
            release/windows-x86_64-release-manifest.json
            release/windows-x86_64-SHA256SUMS
          retention-days: 3
          if-no-files-found: error
      - name: Upload exact installed Windows payload for final rehash
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sau-windows-installed-payload
          path: |
            artifacts/windows-installed-payload.tar
            artifacts/windows-installed-payload.tar.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  macos-universal-package:
    needs: [macos-x86_64, macos-arm64]
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        id: package-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install locked native smoke dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen
      - name: Download verified x86_64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sau-macos-x86_64-payload
          path: ${{ runner.temp }}/payload-artifacts/x86_64
      - name: Download verified arm64 payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sau-macos-arm64-payload
          path: ${{ runner.temp }}/payload-artifacts/arm64
      - name: Verify and extract native payload archives
        run: |
          cd "${RUNNER_TEMP}/payload-artifacts/x86_64"
          shasum -a 256 -c sau-macos-x86_64-payload.tar.sha256
          mkdir -p "${RUNNER_TEMP}/payloads/x86_64"
          tar -xf sau-macos-x86_64-payload.tar -C "${RUNNER_TEMP}/payloads/x86_64"
          cd "${RUNNER_TEMP}/payload-artifacts/arm64"
          shasum -a 256 -c sau-macos-arm64-payload.tar.sha256
          mkdir -p "${RUNNER_TEMP}/payloads/arm64"
          tar -xf sau-macos-arm64-payload.tar -C "${RUNNER_TEMP}/payloads/arm64"
      - name: Assemble and inspect unsigned universal package
        env:
          SAU_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          packaging/macos/build_pkg.sh \
            "${RUNNER_TEMP}/payloads/x86_64/SocialAutoUpload" \
            "${RUNNER_TEMP}/payloads/arm64/SocialAutoUpload" release
          rm -rf "${RUNNER_TEMP}/expanded-package"
          pkgutil --expand-full release/SocialAutoUpload-macOS-Universal.pkg "${RUNNER_TEMP}/expanded-package"
          test -x "${RUNNER_TEMP}/expanded-package"/*/Payload/Applications/Social\ Auto\ Upload.app/Contents/MacOS/launcher
      - name: Verify unsigned signature check
        run: |
          set +e
          output=$(pkgutil --check-signature release/SocialAutoUpload-macOS-Universal.pkg 2>&1)
          status=$?
          set -e
          [[ $status -ne 0 ]]
          grep -qi 'no signature' <<<"$output"
      - name: Run native package install smoke
        env:
          SOCIAL_AUTO_UPLOAD_HOME: ${{ runner.temp }}/sau-installed-home
        run: |
          app="/Applications/Social Auto Upload.app"
          cli="/usr/local/bin/sau"
          [[ ! -e "$app" ]]
          [[ ! -e "$cli" && ! -L "$cli" ]]
          cleanup() {
            sudo rm -rf -- "$app"
            if [[ -f "$cli" ]] && grep -Fq '/Applications/Social Auto Upload.app/Contents/MacOS/sau' "$cli"; then
              sudo rm -f -- "$cli"
            fi
          }
          trap cleanup EXIT
          sudo installer -pkg release/SocialAutoUpload-macOS-Universal.pkg -target /
          .venv/bin/python -m release_tools.smoke_macos_install --expected-arch x86_64
          cleanup
          trap - EXIT
      - name: Collect macOS verification metadata
        run: |
          pkg=release/SocialAutoUpload-macOS-Universal.pkg
          digest=$(shasum -a 256 "$pkg" | awk '{print $1}')
          printf '%s  %s\n' "$digest" "$(basename "$pkg")" >"${pkg}.sha256"
          cp "${RUNNER_TEMP}/payloads/x86_64/SocialAutoUpload/release-manifest.json" release/macos-x86_64-release-manifest.json
          cp "${RUNNER_TEMP}/payloads/x86_64/SocialAutoUpload/SHA256SUMS" release/macos-x86_64-SHA256SUMS
          cp "${RUNNER_TEMP}/payloads/arm64/SocialAutoUpload/release-manifest.json" release/macos-arm64-release-manifest.json
          cp "${RUNNER_TEMP}/payloads/arm64/SocialAutoUpload/SHA256SUMS" release/macos-arm64-SHA256SUMS
      - name: Upload verified universal macOS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sau-macos-universal-installer
          path: |
            release/SocialAutoUpload-macOS-Universal.pkg
            release/SocialAutoUpload-macOS-Universal.pkg.sha256
            release/macos-x86_64-release-manifest.json
            release/macos-x86_64-SHA256SUMS
            release/macos-arm64-release-manifest.json
            release/macos-arm64-SHA256SUMS
          retention-days: 3
          if-no-files-found: error

  release-verification:
    needs: [windows-x86_64, macos-universal-package]
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: arm64
      - name: Cache locked final verification dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/uv
          key: macos-arm64-final-uv-${{ hashFiles('uv.lock') }}
      - name: Install locked final verification dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen
      - name: Download verified macOS installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sau-macos-universal-installer
          path: final/macos
      - name: Download verified Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sau-windows-x86_64-installer
          path: final/windows
      - name: Download exact installed Windows payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: sau-windows-installed-payload
          path: verification/windows-installed-artifact
      - name: Verify the uploaded package natively on Apple Silicon
        env:
          SOCIAL_AUTO_UPLOAD_HOME: ${{ runner.temp }}/sau-final-arm64-home
        run: |
          pkg="final/macos/SocialAutoUpload-macOS-Universal.pkg"
          app="/Applications/Social Auto Upload.app"
          cli="/usr/local/bin/sau"
          [[ ! -e "$app" ]]
          [[ ! -e "$cli" && ! -L "$cli" ]]
          cleanup() {
            sudo rm -rf -- "$app"
            if [[ -f "$cli" ]] && grep -Fq '/Applications/Social Auto Upload.app/Contents/MacOS/sau' "$cli"; then
              sudo rm -f -- "$cli"
            fi
          }
          trap cleanup EXIT
          sudo installer -pkg "$pkg" -target /
          .venv/bin/python -m release_tools.smoke_macos_install --expected-arch arm64
          cleanup
          trap - EXIT
      - name: Rehash exact packaged and installed payloads
        run: |
          (
            cd final/macos
            shasum -a 256 -c SocialAutoUpload-macOS-Universal.pkg.sha256
          )
          (
            cd verification/windows-installed-artifact
            shasum -a 256 -c windows-installed-payload.tar.sha256
          )
          expanded="${RUNNER_TEMP}/final-expanded-package"
          windows_root="${RUNNER_TEMP}/final-windows-installed"
          originals="${RUNNER_TEMP}/final-original-metadata"
          rm -rf -- "$expanded" "$windows_root" "$originals"
          mkdir -p -- "$windows_root" "$originals"
          pkgutil --expand-full final/macos/SocialAutoUpload-macOS-Universal.pkg "$expanded"
          app_count=$(find "$expanded" -type d -name 'Social Auto Upload.app' -print | wc -l | tr -d ' ')
          [[ "$app_count" == "1" ]]
          packaged_app=$(find "$expanded" -type d -name 'Social Auto Upload.app' -print -quit)
          tar -xf verification/windows-installed-artifact/windows-installed-payload.tar -C "$windows_root"
          windows_payload="${windows_root}/SocialAutoUpload-installed"

          verify_and_compare() {
            local payload=$1
            local platform_name=$2
            local arch=$3
            local declared_manifest=$4
            local declared_sums=$5
            local label=$6
            local saved="${originals}/${label}"
            mkdir -p -- "$saved"
            cp "$payload/release-manifest.json" "$saved/release-manifest.json"
            cp "$payload/SHA256SUMS" "$saved/SHA256SUMS"
            .venv/bin/python -m release_tools.verify_release \
              --root "$payload" --platform "$platform_name" --arch "$arch"
            cmp "$saved/release-manifest.json" "$payload/release-manifest.json"
            cmp "$saved/SHA256SUMS" "$payload/SHA256SUMS"
            cmp "$payload/release-manifest.json" "$declared_manifest"
            cmp "$payload/SHA256SUMS" "$declared_sums"
          }

          verify_and_compare \
            "$packaged_app/Contents/Resources/payloads/x86_64" darwin x86_64 \
            final/macos/macos-x86_64-release-manifest.json \
            final/macos/macos-x86_64-SHA256SUMS macos-x86_64
          verify_and_compare \
            "$packaged_app/Contents/Resources/payloads/arm64" darwin arm64 \
            final/macos/macos-arm64-release-manifest.json \
            final/macos/macos-arm64-SHA256SUMS macos-arm64
          verify_and_compare \
            "$windows_payload" windows x86_64 \
            final/windows/windows-x86_64-release-manifest.json \
            final/windows/windows-x86_64-SHA256SUMS windows-x86_64
      - name: verify exactly two installers and all manifests and checksums
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("final")
          expected = {
              root / "macos": {
                  "SocialAutoUpload-macOS-Universal.pkg",
                  "SocialAutoUpload-macOS-Universal.pkg.sha256",
                  "macos-x86_64-release-manifest.json",
                  "macos-x86_64-SHA256SUMS",
                  "macos-arm64-release-manifest.json",
                  "macos-arm64-SHA256SUMS",
              },
              root / "windows": {
                  "SocialAutoUpload-Windows-x64-Setup.exe",
                  "SocialAutoUpload-Windows-x64-Setup.exe.sha256",
                  "windows-x86_64-release-manifest.json",
                  "windows-x86_64-SHA256SUMS",
              },
          }
          for directory, names in expected.items():
              actual = {path.name for path in directory.iterdir() if path.is_file()}
              if actual != names:
                  raise SystemExit(f"unexpected release files in {directory}: {sorted(actual)}")
          installers = [
              root / "macos" / "SocialAutoUpload-macOS-Universal.pkg",
              root / "windows" / "SocialAutoUpload-Windows-x64-Setup.exe",
          ]
          if len(installers) != 2 or not all(path.is_file() and path.stat().st_size for path in installers):
              raise SystemExit("exactly two non-empty installers are required")
          for installer in installers:
              sidecar = installer.with_name(installer.name + ".sha256")
              expected_hash, expected_name = sidecar.read_text(encoding="ascii").split()
              if expected_name != installer.name:
                  raise SystemExit(f"checksum filename mismatch: {sidecar}")
              actual_hash = hashlib.sha256(installer.read_bytes()).hexdigest()
              if actual_hash != expected_hash:
                  raise SystemExit(f"installer checksum mismatch: {installer}")
          declarations = (
              (root / "macos" / "macos-x86_64-release-manifest.json", "darwin", "x86_64"),
              (root / "macos" / "macos-arm64-release-manifest.json", "darwin", "arm64"),
              (root / "windows" / "windows-x86_64-release-manifest.json", "windows", "x86_64"),
          )
          for manifest_path, platform, arch in declarations:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              if manifest.get("schema_version") != 2 or manifest.get("platform") != platform or manifest.get("arch") != arch:
                  raise SystemExit(f"payload manifest mismatch: {manifest_path}")
              sums = manifest_path.with_name(manifest_path.name.replace("release-manifest.json", "SHA256SUMS"))
              if not sums.is_file() or not sums.read_text(encoding="utf-8").strip():
                  raise SystemExit(f"payload checksums missing: {sums}")
          print("verified exactly two installers plus three native payload manifests/checksums")
          PY
      - name: Upload final verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sau-verified-desktop-installers
          path: final
          retention-days: 3
          if-no-files-found: error
