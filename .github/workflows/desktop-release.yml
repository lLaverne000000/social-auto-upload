name: Offline desktop release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24.19.0"
  UV_VERSION: "0.12.5"
  BROWSER_REVISION: "1208"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sau_frontend/package-lock.json
      - name: Install locked frontend dependencies and test
        working-directory: sau_frontend
        run: |
          npm ci
          npm run test:frontend
          npm run build

  macos-x86_64:
    needs: frontend
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
      - name: Cache locked Python downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/uv
          key: macos-x86_64-uv-${{ hashFiles('uv.lock') }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sau_frontend/package-lock.json
      - name: Install locked Python and frontend dependencies
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}"
          uv sync --frozen --extra desktop --extra build
          cd sau_frontend
          npm ci
          npm run build
      - name: Download and stage clean matching Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/patchright-browsers
        run: |
          .venv/bin/python -m patchright install chromium
          test -d "${PLAYWRIGHT_BROWSERS_PATH}/chromium-${BROWSER_REVISION}"
          .venv/bin/python -m release_tools.stage_browser \
            --source "${PLAYWRIGHT_BROWSERS_PATH}/chromium-${BROWSER_REVISION}" \
            --target packaging/browser-stage --platform darwin --arch x86_64 \
            --revision "${BROWSER_REVISION}"
      - name: Build and verify native x86_64 frozen payload
        env:
          SAU_PROJECT_ROOT: ${{ github.workspace }}
          SAU_FRONTEND_DIST: ${{ github.workspace }}/sau_frontend/dist
          SAU_BROWSER_STAGE: ${{ github.workspace }}/packaging/browser-stage
        run: |
          .venv/bin/python -m PyInstaller --clean --noconfirm \
            --workpath build/pyinstaller-macos-x86_64 --distpath dist \
            packaging/pyinstaller/social_auto_upload.spec
          .venv/bin/python -m release_tools.verify_release \
            --root dist/SocialAutoUpload --platform darwin --arch x86_64
          file dist/SocialAutoUpload/sau dist/SocialAutoUpload/SocialAutoUpload
      - name: Run frozen CLI smoke
        env:
          SOCIAL_AUTO_UPLOAD_HOME: ${{ runner.temp }}/sau-cli-home
        run: dist/SocialAutoUpload/sau --help
      - name: Run bundled browser smoke
        run: |
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          from patchright.sync_api import sync_playwright
          root = Path("dist/SocialAutoUpload/_internal")
          manifest = json.loads((root / "browser-manifest.json").read_text())
          executable = root / manifest["payloads"]["darwin-x86_64"]["executable"]
          with sync_playwright() as api:
              browser = api.chromium.launch(executable_path=str(executable), headless=True)
              page = browser.new_page()
              page.goto("data:text/html,<title>SAU Offline</title><p>browser-ok</p>")
              assert page.title() == "SAU Offline"
              assert page.locator("p").inner_text() == "browser-ok"
              browser.close()
          PY
      - name: Run frozen GUI smoke
        env:
          SOCIAL_AUTO_UPLOAD_HOME: ${{ runner.temp }}/sau-gui-home
        run: |
          dist/SocialAutoUpload/SocialAutoUpload >"${RUNNER_TEMP}/sau-gui.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          port=""
          for _ in $(seq 1 100); do
            port=$(lsof -Pan -p "$pid" -iTCP -sTCP:LISTEN 2>/dev/null | awk '/127\.0\.0\.1:/ {sub(/^.*:/, "", $9); print $9; exit}')
            [[ -n "$port" ]] && break
            kill -0 "$pid" 2>/dev/null || { cat "${RUNNER_TEMP}/sau-gui.log"; exit 1; }
            sleep 0.1
          done
          [[ -n "$port" ]]
          base="http://127.0.0.1:${port}"
          curl --fail --silent --show-error --cookie-jar "${RUNNER_TEMP}/cookies" "${base}/" >/dev/null
          curl --fail --silent --show-error --cookie "${RUNNER_TEMP}/cookies" \
            --header "Origin: ${base}" --request POST "${base}/api/v1/app/quit" >/dev/null
          wait "$pid"
          trap - EXIT
      - name: Archive verified x86_64 payload without losing symlinks
        run: |
          mkdir -p artifacts
          tar -C dist -cf artifacts/sau-macos-x86_64-payload.tar SocialAutoUpload
          cd artifacts
          shasum -a 256 sau-macos-x86_64-payload.tar >sau-macos-x86_64-payload.tar.sha256
      - name: Upload verified x86_64 payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sau-macos-x86_64-payload
          path: |
            artifacts/sau-macos-x86_64-payload.tar
            artifacts/sau-macos-x86_64-payload.tar.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

