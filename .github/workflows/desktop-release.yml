        run: |
          dist/SocialAutoUpload/SocialAutoUpload >"${RUNNER_TEMP}/sau-gui.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          port=""
          for _ in $(seq 1 100); do
